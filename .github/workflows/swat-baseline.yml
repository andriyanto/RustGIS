name: SWAT+ baseline

# Builds the original SWAT+ engine (Fortran) at a pinned commit, runs its reference scenarios with
# daily output, and keeps the outputs as an artifact: the baseline the Rust port of the engine is
# compared against, day by day (docs/swat/design.md). It also checks that this Fortran build
# reproduces the average annual outputs committed in the SWAT+ repository, so the baseline itself
# is trusted.
#
# Runs on demand, and when this workflow or the SWAT tools change.

on:
  workflow_dispatch:
    inputs:
      swatplus_ref:
        description: "swat-model/swatplus commit or tag to build"
        required: false
        default: "6f515368525e7d84089ae0f9d33f4c9115de5679"
  push:
    paths:
      - ".github/workflows/swat-baseline.yml"
      - "tools/swat/**"
  pull_request:
    paths:
      - ".github/workflows/swat-baseline.yml"
      - "tools/swat/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWATPLUS_REF: ${{ inputs.swatplus_ref || '6f515368525e7d84089ae0f9d33f4c9115de5679' }}

jobs:
  baseline:
    name: Build SWAT+ and run reference scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check out SWAT+
        uses: actions/checkout@v7
        with:
          repository: swat-model/swatplus
          ref: ${{ env.SWATPLUS_REF }}
          path: swatplus
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran ninja-build
          gfortran --version | head -1

      - name: Build SWAT+ (Release)
        working-directory: swatplus
        run: |
          short="${SWATPLUS_REF:0:7}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DTAG="$short"
          cmake --build build
          exe=$(find build -maxdepth 1 -type f -name 'swatplus-*' -perm -u+x | head -1)
          test -n "$exe" || { echo "::error::SWAT+ executable not found"; exit 1; }
          echo "SWATPLUS_EXE=$PWD/$exe" >> "$GITHUB_ENV"
          echo "Built $exe"

      # The committed outputs may come from an older SWAT+ revision, so a difference here is reported
      # in the summary rather than failing the baseline.
      - name: Check the build against the committed reference outputs (Ames_sub1)
        continue-on-error: true
        run: |
          mkdir -p runs/check
          cp -r swatplus/refdata/Ames_sub1 runs/check/Ames_sub1
          cp -r swatplus/refdata/Ames_sub1 runs/check/expected
          (cd runs/check/Ames_sub1 && "$SWATPLUS_EXE" > run.log 2>&1)
          test -f runs/check/Ames_sub1/success.fin || { tail -50 runs/check/Ames_sub1/run.log; exit 1; }
          status=0
          python3 tools/swat/compare_outputs.py runs/check/expected runs/check/Ames_sub1 \
            --pattern '*_aa.txt' --abserr 1e-3 --relerr 1e-3 --json runs/check/compare.json \
            > runs/check/compare.txt || status=$?
          cat runs/check/compare.txt
          # Annotations can be read through the API (check runs), unlike the step summary.
          verdict=$(tail -1 runs/check/compare.txt)
          if [ "$status" -eq 0 ]; then
            echo "::notice title=Reference check (Ames_sub1)::$verdict"
          else
            echo "::warning title=Reference check (Ames_sub1)::$verdict"
            # One annotation per file outside tolerance, with its status and first example.
            python3 - <<'PY'
          import json
          for r in json.load(open("runs/check/compare.json")):
              if r["status"] != "ok":
                  ex = " | ".join(r["examples"][:2])
                  print(f"::warning title=Reference {r['name']}::{r['status']}, max_rel {r['max_rel']:.3g}: {ex}")
          PY
          fi
          exit $status

      - name: Run reference scenarios with daily output
        run: |
          for scenario in Osu_1hru Ames_sub1; do
            dir="runs/baseline/$scenario"
            mkdir -p runs/baseline
            cp -r "swatplus/refdata/$scenario" "$dir"
            # Daily output for the water balance, the nutrient, loss and plant tables and the
            # routing objects; the rest keep the scenario's own settings (all objects daily made
            # a 1.6 GB baseline).
            python3 tools/swat/enable_daily_output.py \
              --only basin_wb,basin_aqu,basin_sd_cha,hru_wb,hru_nb,hru_ls,hru_pw,channel_sd,aquifer,ru \
              "$dir"
            start=$(date +%s)
            (cd "$dir" && "$SWATPLUS_EXE" > run.log 2>&1)
            end=$(date +%s)
            test -f "$dir/success.fin" || { echo "::error::$scenario failed"; tail -50 "$dir/run.log"; exit 1; }
            files=$(find "$dir" -maxdepth 1 -name '*_day.txt' | wc -l)
            size=$(du -sh "$dir" | cut -f1)
            echo "$scenario: $((end - start)) s, $files daily tables, $size" | tee -a runs/baseline/timings.txt
            echo "::notice title=Baseline $scenario::$((end - start)) s, $files daily tables, $size"
            largest=$(find "$dir" -maxdepth 1 -type f -printf '%s %f\n' | sort -rn | head -6 \
              | awk '{printf "%s %.0f MB; ", $2, $1/1048576}')
            echo "::notice title=Largest files $scenario::$largest"
          done

      - name: Write the baseline manifest
        run: |
          {
            echo "swatplus_ref: $SWATPLUS_REF"
            echo "compiler: $(gfortran --version | head -1)"
            echo "runner: ubuntu-24.04"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustgis_commit: $GITHUB_SHA"
          } > runs/baseline/MANIFEST.txt
          cat runs/baseline/MANIFEST.txt
          du -sh runs/baseline/*

      - name: Summary
        if: always()
        run: |
          {
            echo "## SWAT+ baseline"
            echo
            echo "SWAT+ commit: \`$SWATPLUS_REF\`"
            echo
            echo "Reference outputs committed in SWAT+: $(head -1 swatplus/refdata/Ames_sub1/basin_wb_aa.txt | tr -s ' ')"
            echo
            echo "### Build check against committed outputs (Ames_sub1, average annual)"
            echo '```'
            tail -1 runs/check/compare.txt 2>/dev/null || echo "not run"
            echo '```'
            echo "### Run times"
            echo '```'
            cat runs/baseline/timings.txt 2>/dev/null || echo "not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the baseline
        uses: actions/upload-artifact@v7
        with:
          name: swatplus-baseline-${{ env.SWATPLUS_REF }}
          path: |
            runs/baseline
            runs/check/compare.txt
            runs/check/compare.json
          retention-days: 90

      - name: Upload the SWAT+ executable
        uses: actions/upload-artifact@v7
        with:
          name: swatplus-exe-linux-${{ env.SWATPLUS_REF }}
          path: ${{ env.SWATPLUS_EXE }}
          retention-days: 90
